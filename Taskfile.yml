version: "3"

# Run `task --list` to see everything. Backend tasks run in backend/, frontend tasks in frontend/.

vars:
  DEV_COMPOSE: deploy/docker-compose.dev.yml
  LOCAL_COMPOSE: deploy/docker-compose.local.yml
  LOCAL_OBS_COMPOSE: deploy/docker-compose.local.obs.yml

tasks:
  dev:up:
    desc: Start Postgres and Redis for local development
    cmds:
      - docker compose -f {{.DEV_COMPOSE}} up -d --wait

  dev:down:
    desc: Stop the development services (data volumes are kept)
    cmds:
      - docker compose -f {{.DEV_COMPOSE}} down

  local:up:
    desc: Build and start the whole app in Docker (tipd + Postgres + Redis) on http://localhost:8080
    cmds:
      - docker compose -f {{.LOCAL_COMPOSE}} up -d --build --wait

  local:obs:up:
    desc: Same as local:up plus Prometheus, Loki, Vector and Grafana (http://localhost:3000, admin / admin-dev-password)
    cmds:
      - docker compose -f {{.LOCAL_COMPOSE}} -f {{.LOCAL_OBS_COMPOSE}} up -d --build --wait

  local:obs:down:
    desc: Stop the local stack together with its observability services; pass -- -v to also delete data
    cmds:
      - docker compose -f {{.LOCAL_COMPOSE}} -f {{.LOCAL_OBS_COMPOSE}} down {{.CLI_ARGS}}

  local:down:
    desc: Stop the local Docker stack; pass -- -v to also delete its data
    cmds:
      - docker compose -f {{.LOCAL_COMPOSE}} down {{.CLI_ARGS}}

  local:logs:
    desc: Follow the tipd logs of the local Docker stack
    cmds:
      - docker compose -f {{.LOCAL_COMPOSE}} logs -f tipd

  backend:build:
    desc: Build the tipd binary into backend/bin
    dir: backend
    cmds:
      - go build -o bin/tipd ./cmd/tipd

  backend:test:
    desc: Run backend tests with the race detector
    dir: backend
    cmds:
      - go test -race ./...

  backend:lint:
    desc: Run golangci-lint
    dir: backend
    cmds:
      - golangci-lint run

  backend:fmt:
    desc: Format backend code
    dir: backend
    cmds:
      - golangci-lint fmt

  frontend:install:
    desc: Install frontend dependencies
    dir: frontend
    cmds:
      - npm ci

  frontend:dev:
    desc: Start the Vite dev server
    dir: frontend
    cmds:
      - npm run dev

  frontend:build:
    desc: Build the frontend
    dir: frontend
    cmds:
      - npm run build

  frontend:test:
    desc: Run frontend unit tests
    dir: frontend
    cmds:
      - npm test

  frontend:lint:
    desc: Lint the frontend
    dir: frontend
    cmds:
      - npm run lint

  frontend:typecheck:
    desc: Type-check the frontend
    dir: frontend
    cmds:
      - npm run typecheck

  e2e:
    desc: Browser end-to-end and visual tests (Playwright). Starts Postgres/Redis, builds the SPA and tipd; pass extra flags after --, e.g. `task e2e -- --headed --project=chromium-desktop`
    dir: frontend
    cmds:
      - npx playwright install chromium firefox webkit
      - npx playwright test {{.CLI_ARGS}}

  gen:
    desc: Generate API code from backend/api/openapi.yaml (Go DTOs + chi ServerInterface, then TypeScript types)
    cmds:
      - cmd: go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen -config api/oapi-codegen.yaml api/openapi.yaml
        dir: backend
      - cmd: npm run gen:api
        dir: frontend
        ignore_error: true # the frontend may not be installed yet

  ci:
    desc: Run the same checks as CI
    cmds:
      - task: backend:build
      - task: backend:lint
      - task: backend:test
      - task: frontend:typecheck
      - task: frontend:lint
      - task: frontend:test
      - task: frontend:build
