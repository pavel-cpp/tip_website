# Loki 3.x, monolithic (-target=all), filesystem storage, single tenant.
# Started with -config.expand-env=true so ${OBS_RETENTION_DAYS} is read from
# the container environment: changing the retention means changing the
# variable and running `docker compose up -d`.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  # Fewer, larger, compressed chunks: friendlier to an HDD and to RAM.
  chunk_idle_period: 30m
  max_chunk_age: 2h
  chunk_encoding: snappy
  wal:
    dir: /loki/wal

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 50
  delete_request_store: filesystem

limits_config:
  retention_period: ${OBS_RETENTION_DAYS:-3}d
  # Storm protection (docs/05-observability.md section 1).
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 6MB
  max_label_names_per_series: 8
  max_line_size: 64KB
  max_streams_per_user: 1000
  max_query_series: 500
  max_entries_limit_per_query: 5000
  reject_old_samples: true
  reject_old_samples_max_age: 48h
  allow_structured_metadata: false
  volume_enabled: false

# Caches are disabled to keep the memory footprint inside 256 MB.
chunk_store_config:
  chunk_cache_config:
    embedded_cache:
      enabled: false

query_range:
  cache_results: false
  results_cache:
    cache:
      embedded_cache:
        enabled: false

querier:
  max_concurrent: 4

analytics:
  reporting_enabled: false
