# Overlay for the shared production server: nginx on the HOST terminates TLS and proxies to Caddy, which
# listens on loopback only and speaks plain HTTP (Caddyfile.edge). Nothing else is published.
# The server never builds images: CI builds them and deploy.sh pulls them by tag.
#
#   docker compose -p tip -f docker-compose.prod.yml -f docker-compose.server.yml --env-file prod.env up -d
#
# Needs Docker Compose 2.24+ (!override / !reset tags).

services:
  caddy:
    ports: !override
      - "127.0.0.1:${EDGE_PORT:-8080}:8080"
    volumes: !override
      - ./Caddyfile.edge:/etc/caddy/Caddyfile:ro
      - caddy:/data
    environment: !override
      GOMEMLIMIT: 28MiB

  tipd:
    build: !reset null

  backup:
    build: !reset null
