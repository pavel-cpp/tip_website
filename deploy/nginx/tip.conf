# Host nginx for TIP. __DOMAIN__ is replaced by deploy/scripts/bootstrap-server.sh.
# Installed as /etc/nginx/sites-available/tip.conf (symlinked into sites-enabled); it touches no other site.
#
#   internet -> nginx :443 (TLS) -> Caddy 127.0.0.1:8080 (docker) -> tipd
#
# Caddy compresses (zstd/gzip), so gzip stays off here. The Content-Security-Policy and the other security
# headers come from tipd/Caddy; nginx adds only HSTS (and hides the upstream copy so there is one).

map $http_upgrade $tip_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream tip_caddy {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TIP_SSL:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    gzip off;
    # Uploads are limited to 10 MB by the app (MAX_IMAGE_MB); Caddy allows 12 MB with the multipart envelope.
    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_hide_header Strict-Transport-Security;

    # Realtime collaboration: long-lived upgraded connections, nothing buffered.
    location ~ ^/api/v1/projects/[^/]+/ws$ {
        proxy_pass http://tip_caddy;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwritten, not appended: this is the edge, nothing the client sent can be trusted.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $tip_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://tip_caddy;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
}
