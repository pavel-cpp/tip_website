# TIP production stack. Target host: 2 vCPU, 2 GB RAM, 10 GB HDD.
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/prod.env up -d
#
# Memory limits follow docs/05-observability.md section 6.0 (containers sum to
# about 1 GB). memswap_limit equals mem_limit so containers never touch swap:
# swapping on an HDD is worse than an OOM kill. oom_score_adj makes the kernel
# sacrifice observability before tipd, Postgres and Redis.
#
# Caddy is the only public edge (80, 443, 443/udp) and gets and renews the certificate itself. Docker publishes
# ports around ufw, so no other service may publish a port unless it is bound to 127.0.0.1.
#
# Profiles: loki, vector and grafana are in the optional `obs` profile (off by default, they do not fit
# next to other workloads on a 2 GB host). Enable with `--profile obs`, set LOKI_URL=http://loki:3100 and the
# GRAFANA_* variables in the env file, and copy caddy.d/grafana.caddy.example to caddy.d/grafana.caddy
# (Grafana is then reachable at https://DOMAIN/grafana/).
#
# Image tags are pinned to known-good versions; bump them deliberately.
# # VERIFY: all third-party tags below were chosen from memory and must be
# checked against the registries before the first deploy.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

name: tip

services:
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    mem_limit: 32m
    memswap_limit: 32m
    oom_score_adj: -200
    environment:
      GOMEMLIMIT: 28MiB
      DOMAIN: ${DOMAIN:?set DOMAIN}
      # Whole option lines for the Caddyfile global block; empty (so omitted) when the variable is unset or empty.
      # ACME_CA example (Let's Encrypt staging for a first run): https://acme-staging-v02.api.letsencrypt.org/directory
      ACME_EMAIL_OPT: ${ACME_EMAIL:+email ${ACME_EMAIL}}
      ACME_CA_OPT: ${ACME_CA:+acme_ca ${ACME_CA}}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy.d:/etc/caddy/conf.d:ro
      # Certificates and the ACME account: survive deploys, never prune this volume.
      - caddy:/data
    networks: [internal]
    depends_on:
      tipd:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    labels:
      tip.logs: "true"

  tipd:
    image: ${TIPD_IMAGE:-tip/tipd:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    mem_limit: 96m
    memswap_limit: 96m
    oom_score_adj: -500
    environment:
      GOMEMLIMIT: 80MiB
      HTTP_ADDR: ":8080"
      INTERNAL_ADDR: ":9090"
      DATA_DIR: /data
      DATABASE_URL: postgres://${POSTGRES_USER:-tip}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tip}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
      REDIS_FAIL_MODE: ${REDIS_FAIL_MODE:-open}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?set PASSWORD_PEPPER}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      FORCE_PASSWORD_CHANGE: ${FORCE_PASSWORD_CHANGE:-false}
      BOOTSTRAP_ADMIN_LOGIN: ${BOOTSTRAP_ADMIN_LOGIN:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      # Shown as a link in the admin menu.
      GRAFANA_URL: ${GRAFANA_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_IMAGE_MB: ${MAX_IMAGE_MB:-10}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-16000000}
      MIN_FREE_DISK_MB: ${MIN_FREE_DISK_MB:-1024}
      UPLOADS_MAX_TOTAL_MB: ${UPLOADS_MAX_TOTAL_MB:-800}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-30}
      AUDIT_MAX_ROWS: ${AUDIT_MAX_ROWS:-100000}
      OBS_RETENTION_DAYS: ${OBS_RETENTION_DAYS:-3}
      # The admin status page reads the backup metrics file and probes Loki.
      BACKUP_METRICS_PATH: /backups/metrics/backup.prom
      LOKI_URL: ${LOKI_URL:-off}
    volumes:
      - uploads:/data
      - backups:/backups:ro
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Distroless has no shell or wget, so the probe is a subcommand of the
    # binary itself (GET /readyz on localhost).
    healthcheck:
      test: ["CMD", "/tipd", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging
    labels:
      tip.logs: "true"

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    mem_limit: 160m
    memswap_limit: 160m
    oom_score_adj: -500
    # Tuning per docs/03-database.md section 5. Slow queries go to stdout and
    # on to Loki through Vector.
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=20
      - -c
      - max_wal_size=256MB
      - -c
      - min_wal_size=64MB
      - -c
      - checkpoint_timeout=15min
      - -c
      - wal_compression=on
      - -c
      - log_min_duration_statement=300ms
      - -c
      - log_connections=off
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tip}
      POSTGRES_USER: ${POSTGRES_USER:-tip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      # Postgres 18 images keep PGDATA in a version subdirectory, so the volume
      # is mounted one level higher. VERIFY against the image documentation.
      - pgdata:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    labels:
      tip.logs: "true"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 32m
    memswap_limit: 32m
    oom_score_adj: -400
    # noeviction: eviction would silently un-revoke tokens. AOF keeps the
    # revocation state across restarts. The password is read from the
    # environment so it does not show up in `docker inspect` arguments.
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --maxmemory 24mb
        --maxmemory-policy noeviction
        --appendonly yes
        --appendfsync everysec
        --save ""
        --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging
    labels:
      tip.logs: "true"

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    oom_score_adj: 500
    environment:
      GOMEMLIMIT: 100MiB
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${OBS_RETENTION_DAYS:-3}d
      - --storage.tsdb.retention.size=300MB
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    labels:
      tip.logs: "true"

  loki:
    image: grafana/loki:3.3.2
    profiles: [obs]
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    oom_score_adj: 500
    environment:
      GOMEMLIMIT: 200MiB
      OBS_RETENTION_DAYS: ${OBS_RETENTION_DAYS:-3}
    command:
      - -config.file=/etc/loki/loki.yml
      - -config.expand-env=true
      - -target=all
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - lokidata:/loki
    networks: [internal]
    healthcheck:
      # busybox wget is present in the Loki image (checked with 3.3.2).
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *default-logging
    labels:
      tip.logs: "true"

  vector:
    image: timberio/vector:0.43.1-alpine
    profiles: [obs]
    restart: unless-stopped
    mem_limit: 48m
    memswap_limit: 48m
    oom_score_adj: 500
    command: ["--config", "/etc/vector/vector.yaml"]
    environment:
      VECTOR_LOG: warn
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      # Read-only socket access is still effectively root on the host; Vector
      # only lists containers and reads logs, and nothing else reaches it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]
    depends_on:
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8686/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging
    labels:
      tip.logs: "true"

  grafana:
    image: grafana/grafana:11.4.0
    profiles: [obs]
    restart: unless-stopped
    mem_limit: 192m
    memswap_limit: 192m
    oom_score_adj: 600
    environment:
      GOMEMLIMIT: 160MiB
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_COOKIE_SECURE: "true"
      # Served by Caddy under /grafana on the main domain (caddy.d/grafana.caddy), so Grafana must know its prefix.
      GF_SERVER_DOMAIN: ${DOMAIN}
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_LOG_LEVEL: warn
      # Analytics, update checks, news and plugin management off (RAM and
      # outbound traffic). VERIFY option names against the Grafana docs.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 15s
      # Alert delivery. Used by deploy/grafana/provisioning/alerting.
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-localhost:25}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-alerts@${DOMAIN:-example.com}}
      GF_SMTP_FROM_NAME: ${GF_SMTP_FROM_NAME:-TIP alerts}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-admin@${DOMAIN:-example.com}}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://127.0.0.1:9/disabled}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana-dashboards:ro
    networks: [internal]
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/grafana/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *default-logging
    labels:
      tip.logs: "true"

  node_exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    mem_limit: 16m
    memswap_limit: 16m
    oom_score_adj: 500
    environment:
      GOMEMLIMIT: 12MiB
    # Only the collectors the dashboards and alerts use. The textfile
    # directory holds the backup metrics written by the backup container.
    command:
      - --path.rootfs=/host
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.loadavg
      - --collector.filesystem
      - --collector.diskstats
      - --collector.netdev
      - --collector.textfile
      - --collector.textfile.directory=/backups/metrics
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
    volumes:
      - /:/host:ro,rslave
      - backups:/backups:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    labels:
      tip.logs: "true"

  # Per-container CPU / RAM / log size and per-volume disk size for the "TIP Resources" dashboard. Writes a
  # textfile next to the backup metrics, node_exporter serves it. Everything is mounted read-only; the Docker
  # socket is only used to list containers. No network: it only reads files.
  hostmetrics:
    image: docker:28.5.2-cli
    restart: unless-stopped
    mem_limit: 24m
    memswap_limit: 24m
    oom_score_adj: 500
    network_mode: none
    entrypoint: ["sh", "/collect.sh"]
    volumes:
      - ./hostmetrics/collect.sh:/collect.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/host/cgroup:ro
      - /var/lib/docker:/host/docker:ro
      - /var/lib/containerd:/host/containerd:ro
      - backups:/backups
    healthcheck:
      test: ["CMD", "sh", "-c", "find /backups/metrics/containers.prom -mmin -2 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging

  backup:
    image: ${BACKUP_IMAGE:-tip/backup:local}
    build:
      context: ./backup
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    oom_score_adj: 400
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-tip}
      PGDATABASE: ${POSTGRES_DB:-tip}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      BACKUP_CRON: ${BACKUP_CRON:-30 1 * * *}
      BACKUP_KEEP: ${BACKUP_KEEP:-3}
      BACKUP_MIN_FREE_MB: ${BACKUP_MIN_FREE_MB:-1500}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      RCLONE_CONFIG: /run/secrets/rclone_conf
      GOMEMLIMIT: 48MiB
    volumes:
      - backups:/backups
      - uploads:/data:ro
    secrets:
      - rclone_conf
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond > /dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging: *default-logging
    labels:
      tip.logs: "true"

secrets:
  rclone_conf:
    # Falls back to an empty file, which disables off-site upload.
    file: ${RCLONE_CONFIG_FILE:-/dev/null}

volumes:
  pgdata:
  redisdata:
  uploads:
  promdata:
  lokidata:
  grafanadata:
  backups:
  caddy:

# A normal bridge network (not `internal: true`): Caddy needs ACME, Grafana
# needs SMTP/webhooks and the backup job needs the off-site remote. Only Caddy
# publishes host ports, so nothing else is reachable from outside.
networks:
  internal:
