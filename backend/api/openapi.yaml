      description: Newest first; paginate with `before` set to the previous page's `next`. Entries carry IDs and numbers only, never personal data.
      x-required-permissions: [audit.view]
      parameters:
        - name: limit
          in: query
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: before
          in: query
          description: Return entries with an id lower than this value.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: projectId
          in: query
          description: Restrict to one project.
          schema:
            type: string
            format: uuid
        - name: actor
          in: query
          description: Restrict to actions of one user (user id).
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          description: Restrict to one dotted action name, for example `user.create`.
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: "^[a-z0-9_.]+$"
      responses:
        "200":
          description: A page of audit entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
