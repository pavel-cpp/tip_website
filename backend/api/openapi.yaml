          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "507":
          $ref: "#/components/responses/DiskLow"
        "500":
          $ref: "#/components/responses/InternalError"
  /fonts/{id}:
    delete:
      tags: [Fonts]
      operationId: deleteFont
      summary: Delete an uploaded font
      description: |
        Refused with `VALIDATION` while a project placeholder still uses the font. Written to the audit log
        (`font.delete`).
      x-required-permissions: [project.update]
      parameters:
        - $ref: "#/components/parameters/FontId"
      responses:
        "204":
          description: The font was deleted.
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /fonts/{id}/file:
    get:
      tags: [Fonts]
      operationId: getFontFile
      summary: Download an uploaded font
      description: |
        Served with a strong `ETag` (the SHA-256 of the file) and `Cache-Control: immutable`; the content
        behind an id never changes.
      x-required-permissions: [project.view]
      parameters:
        - $ref: "#/components/parameters/FontId"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The font file.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              description: Always `public, max-age=31536000, immutable`.
              schema:
                type: string
          content:
            font/ttf:
              schema:
                type: string
                format: binary
            font/otf:
              schema:
                type: string
                format: binary
            font/woff2:
              schema:
                type: string
                format: binary
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT (HS256, 15 minutes) obtained from `POST /auth/login` or `POST /auth/refresh`.
    refreshCookie:
      type: apiKey
      in: cookie
      name: tip_rt
      description: Refresh JWT in an httpOnly cookie, set by the server.

  headers:
    ETag:
      description: Strong entity tag; send it back in `If-None-Match`.
      schema:
        type: string
        example: '"3f2a9c01"'
    SetRefreshCookie:
      description: '`tip_rt=<refresh JWT>; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth`.'
      schema:
        type: string
    ClearRefreshCookie:
      description: Expires the `tip_rt` cookie.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
        example: 30

  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      description: Project id.
      schema:
        type: string
        format: uuid
    ParticipantId:
      name: id
      in: path
      required: true
      description: Participant row id.
      schema:
        type: string
        format: uuid
    UserId:
      name: id
      in: path
      required: true
      description: User id.
      schema:
        type: string
        format: uuid
    FontId:
      name: id
      in: path
      required: true
      description: Uploaded font id.
      schema:
        type: string
        format: uuid
    RoleId:
      name: id
      in: path
      required: true
      description: Role id.
      schema:
        type: string
        format: uuid
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: ETag previously received; a match yields `304 Not Modified`.
      schema:
        type: string

  responses:
    NotModified:
      description: The cached representation is still current.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
    ValidationFailed:
      description: Invalid data (`VALIDATION`); `details.fields` lists the offending fields.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            validation:
              value:
                error:
                  code: VALIDATION
                  message: Invalid request data
                  details:
                    fields:
                      - { field: title, code: too_long, message: must be at most 120 characters }
    Unauthenticated:
      description: |
        The token is missing or invalid (`UNAUTHENTICATED`, go to login), expired (`TOKEN_EXPIRED`, refresh and retry once)
        or its permission epoch is outdated (`TOKEN_STALE`, refresh and retry once).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unauthenticated:
              value: { error: { code: UNAUTHENTICATED, message: Authentication required } }
            tokenExpired:
              value: { error: { code: TOKEN_EXPIRED, message: Access token expired } }
            tokenStale:
              value: { error: { code: TOKEN_STALE, message: "Permissions changed, refresh the token" } }
    BadCredentials:
      description: Wrong login or password (`BAD_CREDENTIALS`); the reason is not disclosed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: { code: BAD_CREDENTIALS, message: Invalid login or password } }
    RefreshInvalid:
      description: The refresh token is expired, missing, revoked or reused (`REFRESH_INVALID`); sign in again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: { code: REFRESH_INVALID, message: Refresh token is no longer valid } }
    Forbidden:
      description: |
        `FORBIDDEN` when the permission is missing (or a cookie endpoint was called cross-origin);
        `PASSWORD_CHANGE_REQUIRED` when `FORCE_PASSWORD_CHANGE=true` and the temporary password was not changed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            forbidden:
              value: { error: { code: FORBIDDEN, message: Permission denied } }
            passwordChangeRequired:
              value: { error: { code: PASSWORD_CHANGE_REQUIRED, message: Change the temporary password first } }
    NotFound:
      description: The resource does not exist or is hidden from the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: { code: NOT_FOUND, message: Resource not found } }
    ProjectFinished:
      description: The project is finished and read-only (`PROJECT_FINISHED`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: { code: PROJECT_FINISHED, message: Project is finished } }
    ProjectWriteConflict:
      description: |
        `VERSION_CONFLICT` (stale `version`, `details.current` holds the current project) or
        `PROJECT_FINISHED` (the project is read-only).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            versionConflict:
              value: { error: { code: VERSION_CONFLICT, message: Project was changed by someone else, details: { current: {} } } }
            projectFinished:
              value: { error: { code: PROJECT_FINISHED, message: Project is finished } }
    ParticipantWriteConflict:
      description: |
        `ROW_LOCKED` (another user is editing the row, `details.by` is their id), `VERSION_CONFLICT`
        (stale `version`, `details.current` holds the current row) or `PROJECT_FINISHED`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            rowLocked:
              value:
                error:
                  code: ROW_LOCKED
                  message: The row is being edited by another user
                  details: { by: 0198f2f0-7a3c-7c1e-9b57-2f4d5a6b7c8d }
            versionConflict:
              value: { error: { code: VERSION_CONFLICT, message: Row was changed by someone else, details: { current: {} } } }
            projectFinished:
              value: { error: { code: PROJECT_FINISHED, message: Project is finished } }
    LastAdmin:
      description: The last active administrator cannot be deactivated or lose the admin role (`LAST_ADMIN`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: { code: LAST_ADMIN, message: At least one active administrator is required } }
    RoleSystem:
      description: A system role cannot be modified this way (`ROLE_SYSTEM`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: { code: ROLE_SYSTEM, message: The admin role cannot be edited } }
    RoleConflict:
      description: |
        `ROLE_IN_USE` (users still hold the role, `details.users` lists them) or `ROLE_SYSTEM` (system roles cannot be deleted).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            roleInUse:
              value:
                error:
                  code: ROLE_IN_USE
                  message: The role is assigned to users
                  details: { users: [0198f2f0-7a3c-7c1e-9b57-2f4d5a6b7c8d] }
            roleSystem:
              value: { error: { code: ROLE_SYSTEM, message: System roles cannot be deleted } }
    PayloadTooLarge:
      description: The body or file exceeds the limit (`TOO_LARGE`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: { code: TOO_LARGE, message: Payload is too large } }
    UnsupportedMedia:
      description: The file type is not supported (`UNSUPPORTED_MEDIA`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: { code: UNSUPPORTED_MEDIA, message: Only PNG and JPEG are supported } }
    ImageInvalid:
      description: The image cannot be decoded or has too many pixels (`IMAGE_INVALID`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: { code: IMAGE_INVALID, message: The image cannot be decoded } }
    RateLimited:
      description: Too many requests (`RATE_LIMITED`).
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: { code: RATE_LIMITED, message: Too many requests } }
    AuthUnavailable:
      description: Redis is unavailable, so token state cannot be checked (`AUTH_UNAVAILABLE`); retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: { code: AUTH_UNAVAILABLE, message: Authentication backend is unavailable } }
    DiskLow:
      description: Not enough free disk space (`DISK_LOW`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: { code: DISK_LOW, message: Not enough free disk space } }
    InternalError:
      description: Unexpected failure (`INTERNAL`); `message` contains only the request id.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: { code: INTERNAL, message: "request id 0198f2f0-7a3c-7c1e-9b57-2f4d5a6b7c8d" } }

  schemas:
    ErrorCode:
      type: string
      description: Stable machine-readable error code.
      enum:
        - VALIDATION
        - UNAUTHENTICATED
        - AUTH_UNAVAILABLE
        - TOKEN_EXPIRED
        - TOKEN_STALE
        - REFRESH_INVALID
        - BAD_CREDENTIALS
        - FORBIDDEN
        - PASSWORD_CHANGE_REQUIRED
        - NOT_FOUND
        - ROW_LOCKED
        - VERSION_CONFLICT
        - PROJECT_FINISHED
        - LAST_ADMIN
        - ROLE_IN_USE
        - ROLE_SYSTEM
        - TOO_LARGE
        - UNSUPPORTED_MEDIA
        - IMAGE_INVALID
        - RATE_LIMITED
        - DISK_LOW
        - INTERNAL
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: Name of the offending request field (dotted path for nested fields).
          example: title
        code:
          type: string
          description: Short machine-readable reason.
          example: too_long
        message:
          type: string
          example: must be at most 120 characters
    ErrorDetails:
      type: object
      description: Optional context; which members are present depends on the error code.
      additionalProperties: true
      properties:
        fields:
          type: array
          description: Per-field validation problems (`VALIDATION`).
          items:
            $ref: "#/components/schemas/FieldError"
        by:
          type: string
          format: uuid
          description: Id of the user who holds the row lock (`ROW_LOCKED`).
        current:
          type: object
          description: Current state of the conflicting row or project (`VERSION_CONFLICT`).
          additionalProperties: true
        users:
          type: array
          description: Ids of the users who still hold the role (`ROLE_IN_USE`).
          items:
            type: string
            format: uuid
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: Human-readable English text.
            details:
              $ref: "#/components/schemas/ErrorDetails"

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    CheckStatus:
      type: string
      enum: [ok, fail]
    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          required: [postgres, redis, dataDir]
          properties:
            postgres:
              $ref: "#/components/schemas/CheckStatus"
            redis:
              $ref: "#/components/schemas/CheckStatus"
            dataDir:
              $ref: "#/components/schemas/CheckStatus"

    Color:
      type: string
      description: Hex colour `#rrggbb`.
      pattern: '^#[0-9a-fA-F]{6}$'
      example: "#6cb4ff"
    Locale:
      type: string
      enum: [ru, uz]
    Theme:
      type: string
      enum: [dark, light, system]
    PermissionCode:
      type: string
      description: Permission from the catalog (`docs/02-architecture.md`, section 5.1).
      enum:
        - project.view
        - project.view_finished
        - project.create
        - project.update
        - project.finish
        - project.delete
        - participant.view
        - participant.edit
        - participant.print
        - participant.export
        - participant.import
        - participant.delete
        - participant.clear
        - user.view
        - user.manage
        - role.manage
        - audit.view
        - system.view
    RoleRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 50
    User:
      type: object
      required: [id, login, displayName, roles, permissions, color, avatarUrl, locale, theme, passwordTemporary]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
          pattern: '^[a-z0-9._-]{3,32}$'
          example: a.sharafutdinov
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleRef"
        permissions:
          type: array
          description: Effective permissions (the same set as the `perms` claim of the access token).
          items:
            $ref: "#/components/schemas/PermissionCode"
        color:
          $ref: "#/components/schemas/Color"
        avatarUrl:
          type: [string, "null"]
          description: Avatar URL, or null when there is none (the client draws initials).
          example: /api/v1/users/0198f2f0-7a3c-7c1e-9b57-2f4d5a6b7c8d/avatar?v=3f2a
        locale:
          $ref: "#/components/schemas/Locale"
        theme:
          $ref: "#/components/schemas/Theme"
        passwordTemporary:
          type: boolean
          description: True while the user still has a generated password.
      example:
        id: 0198f2f0-7a3c-7c1e-9b57-2f4d5a6b7c8d
        login: a.sharafutdinov
        displayName: Sharafutdin Azimov
        roles:
          - { id: 0198f2f0-1111-7c1e-9b57-2f4d5a6b7c8d, name: admin }
        permissions: [project.view, project.create, participant.edit, role.manage]
        color: "#6cb4ff"
        avatarUrl: /api/v1/users/0198f2f0-7a3c-7c1e-9b57-2f4d5a6b7c8d/avatar?v=3f2a
        locale: ru
        theme: dark
        passwordTemporary: false
    UserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    AdminUser:
      type: object
      required: [user, isActive, lastLoginAt]
      properties:
        user:
          $ref: "#/components/schemas/User"
        isActive:
          type: boolean
        lastLoginAt:
          type: [string, "null"]
          format: date-time
    UserRef:
      type: object
      description: Compact user reference used in contributor lists and role details.
      required: [id, displayName, color, avatarUrl]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        color:
          $ref: "#/components/schemas/Color"
        avatarUrl:
          type: [string, "null"]

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
    TokenResponse:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken:
          type: string
          description: Access JWT.
        expiresIn:
          type: integer
          description: Access token lifetime in seconds.
          example: 900
    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/TokenResponse"
        - type: object
          required: [user]
          properties:
            user:
              $ref: "#/components/schemas/User"
    UpdateMeRequest:
      type: object
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        color:
          $ref: "#/components/schemas/Color"
        locale:
          $ref: "#/components/schemas/Locale"
        theme:
          $ref: "#/components/schemas/Theme"
    ChangePasswordRequest:
      type: object
      required: [current, new]
      properties:
        current:
          type: string
          format: password
          maxLength: 256
        new:
          type: string
          format: password
          minLength: 8
          maxLength: 256
    AvatarUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: PNG or JPEG, at most 2 MiB.
    CreateUserRequest:
      type: object
      required: [login, displayName]
      properties:
        login:
          type: string
          pattern: '^[a-z0-9._-]{3,32}$'
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        roleIds:
          type: array
          description: Requires `role.manage`; omitted means the default role.
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        color:
          $ref: "#/components/schemas/Color"
    CreateUserResponse:
      type: object
      required: [user, tempPassword]
      properties:
        user:
          $ref: "#/components/schemas/User"
        tempPassword:
          type: string
          minLength: 16
          maxLength: 16
          description: Generated password, shown exactly once.
    TempPasswordResponse:
      type: object
      required: [tempPassword]
      properties:
        tempPassword:
          type: string
          minLength: 16
          maxLength: 16
          description: New generated password, shown exactly once.
    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        isActive:
          type: boolean
    SetUserRolesRequest:
      type: object
      required: [roleIds]
      properties:
        roleIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid

    Permission:
      type: object
      required: [code, group, description, requires]
      properties:
        code:
          $ref: "#/components/schemas/PermissionCode"
        group:
          type: string
          description: Display group of the permission.
          example: Participants
        description:
          type: string
        requires:
          type: array
          description: Permissions this one directly depends on (the server adds them to a role automatically).
          items:
            $ref: "#/components/schemas/PermissionCode"
    Role:
      type: object
      required: [id, name, description, isSystem, permissions, userCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 50
        description:
          type: string
          maxLength: 300
        isSystem:
          type: boolean
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PermissionCode"
        userCount:
          type: integer
          minimum: 0
    RoleResponse:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"
    RoleDetailResponse:
      type: object
      required: [role, users]
      properties:
        role:
          $ref: "#/components/schemas/Role"
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserRef"
    CreateRoleRequest:
      type: object
      required: [name, description, permissions]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        description:
          type: string
          maxLength: 300
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PermissionCode"
    UpdateRoleRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        description:
          type: string
          maxLength: 300
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PermissionCode"

    AuditEntry:
      type: object
      required: [id, at, actorId, actorLogin, action, projectId, entityId, meta, ip]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        actorId:
          type: [string, "null"]
          format: uuid
        actorLogin:
          type: string
          description: Login snapshot, readable after the user is deleted.
        action:
          type: string
          description: Dotted action name.
          example: project.finish
        projectId:
          type: [string, "null"]
          format: uuid
        entityId:
          type: [string, "null"]
          format: uuid
        meta:
          type: object
          description: Ids and numbers only, plus the target `login` of account actions; never display names or phones.
          additionalProperties: true
        ip:
          type: [string, "null"]
    AuditPage:
      type: object
      required: [items, next]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next:
          type: [integer, "null"]
          format: int64
          description: Value for the next `before`, or null on the last page.
    SystemCheck:
      type: object
      required: [name, status, detail]
      properties:
        name:
          type: string
          example: postgres
        status:
          type: string
          enum: [ok, warn, fail]
        detail:
          type: string
    SystemStatus:
      type: object
      required: [version, uptime, db, disk, uploads, retention, checks]
      properties:
        version:
          type: string
        uptime:
          type: integer
          description: Process uptime in seconds.
          minimum: 0
        db:
          type: object
          required: [sizeBytes, pool]
          properties:
            sizeBytes:
              type: integer
              format: int64
            pool:
              type: object
              required: [open, inUse, idle, maxOpen]
              properties:
                open:
                  type: integer
                inUse:
                  type: integer
                idle:
                  type: integer
                maxOpen:
                  type: integer
        disk:
          type: object
          required: [free, total]
          properties:
            free:
              type: integer
              format: int64
              description: Free bytes.
            total:
              type: integer
              format: int64
              description: Total bytes.
        uploads:
          type: object
          required: [sizeBytes]
          properties:
            sizeBytes:
              type: integer
              format: int64
              description: Total size of the stored project images (cached for a minute).
        retention:
          type: object
          required: [obsDays, auditDays]
          properties:
            obsDays:
              type: integer
            auditDays:
              type: integer
        checks:
          type: array
          items:
            $ref: "#/components/schemas/SystemCheck"
        links:
          type: object
          description: Operator tools reachable from the admin menu; a key is absent when the tool is disabled or not configured.
          properties:
            swagger:
              type: string
              description: Path of the API documentation, for example /api/docs.
            grafana:
              type: string
              format: uri
              description: Public Grafana address (GRAFANA_URL).

    ProjectStatus:
      type: string
      enum: [active, finished]
    Placeholder:
      type: object
      description: Text style and position of one ticket field; `x` and `y` are pixels of the original image (centre of the text).
      required: [font, size, stroke, color, strokeColor, bold, italic, underline, x, y]
      properties:
        font:
          type: string
          minLength: 1
          maxLength: 64
          description: Font family from the application's allow list, or `custom:<id>` for an uploaded font (see `/fonts`).
        size:
          type: integer
          minimum: 6
          maximum: 400
        stroke:
          type: integer
          minimum: 0
          maximum: 50
        color:
          $ref: "#/components/schemas/Color"
        strokeColor:
          $ref: "#/components/schemas/Color"
        bold:
          type: boolean
        italic:
          type: boolean
        underline:
          type: boolean
        x:
          type: integer
          minimum: 0
        y:
          type: integer
          minimum: 0
      example:
        { font: Montserrat, size: 34, stroke: 2, color: "#FFFFFF", strokeColor: "#141619", bold: true, italic: false, underline: false, x: 512, y: 120 }
    Placeholders:
      type: object
      required: [number, name, phone]
      properties:
        number:
          $ref: "#/components/schemas/Placeholder"
        name:
          $ref: "#/components/schemas/Placeholder"
        phone:
          $ref: "#/components/schemas/Placeholder"
    PlaceholdersPatch:
      type: object
      minProperties: 1
      description: Placeholders to replace; omitted ones stay unchanged.
      properties:
        number:
          $ref: "#/components/schemas/Placeholder"
        name:
          $ref: "#/components/schemas/Placeholder"
        phone:
          $ref: "#/components/schemas/Placeholder"
    ProjectImage:
      type: object
      required: [url, thumbUrl, name, w, h, bytes]
      properties:
        url:
          type: string
          example: /api/v1/projects/0198f2f0-7a3c-7c1e-9b57-2f4d5a6b7c8d/image?v=ab12
        thumbUrl:
          type: string
          description: Small preview (JPEG, at most 480 px on the long side) for lists and cards.
          example: /api/v1/projects/0198f2f0-7a3c-7c1e-9b57-2f4d5a6b7c8d/image?size=thumb&v=ab12
        name:
          type: string
          description: Original file name.
          maxLength: 255
        w:
          type: integer
          minimum: 1
        h:
          type: integer
          minimum: 1
        bytes:
          type: integer
          minimum: 1
    CardImage:
      type: object
      required: [url, thumbUrl]
      properties:
        url:
          type: string
        thumbUrl:
          type: string
          description: Small preview to show on the card instead of the full original.
    Project:
      type: object
      required: [id, title, status, version, image, placeholders, contributors, participantCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 120
        status:
          $ref: "#/components/schemas/ProjectStatus"
        version:
          type: integer
          minimum: 1
        image:
          description: Ticket image metadata, or null while no image is uploaded.
          oneOf:
            - $ref: "#/components/schemas/ProjectImage"
            - type: "null"
        placeholders:
          $ref: "#/components/schemas/Placeholders"
        contributors:
          type: array
          items:
            $ref: "#/components/schemas/UserRef"
        participantCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
    ProjectCard:
      type: object
      description: Compact project subset for the project list.
      required: [id, title, status, image, contributors, participantCount]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 120
        status:
          $ref: "#/components/schemas/ProjectStatus"
        image:
          oneOf:
            - $ref: "#/components/schemas/CardImage"
            - type: "null"
        contributors:
          type: array
          items:
            $ref: "#/components/schemas/UserRef"
        participantCount:
          type: integer
          minimum: 0
    ProjectResponse:
      type: object
      required: [project]
      properties:
        project:
          $ref: "#/components/schemas/Project"
    CreateProjectRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
    UpdateProjectRequest:
      type: object
      required: [version]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        placeholders:
          $ref: "#/components/schemas/PlaceholdersPatch"
        version:
          type: integer
          minimum: 1
    ImageUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: PNG or JPEG, at most 10 MiB and 16 megapixels.

    Font:
      type: object
      description: An uploaded font. Placeholders select it with the font value `custom:<id>`.
      required: [id, name, format, bytes, url, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 60
        format:
          type: string
          enum: [ttf, otf, woff2]
        bytes:
          type: integer
        url:
          type: string
          description: Download URL, cache-busted with the content hash prefix.
          example: /api/v1/fonts/0198f2f0-7a3c-7c1e-9b57-2f4d5a6b7c8d/file?v=ab12cd34
        createdAt:
          type: string
          format: date-time

    FontUpload:
      type: object
      required: [file, name, licenseConfirmed]
      properties:
        file:
          type: string
          format: binary
          description: TTF, OTF (CFF) or WOFF2, at most 2 MiB.
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Display name in the font picker.
        licenseConfirmed:
          type: boolean
          description: Must be `true`; confirms the right to use and embed the font.

    Participant:
      type: object
      required: [id, projectId, number, name, phone, version, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
        name:
          type: string
          maxLength: 200
        phone:
          type: string
          maxLength: 40
        version:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
      example:
        id: 0198f2f0-7a3c-7c1e-9b57-2f4d5a6b7c8d
        projectId: 0198f2ef-0000-7c1e-9b57-2f4d5a6b7c8d
        number: 5
        name: Sharafutdin Azimov
        phone: "+7 926 071-91-98"
        version: 7
        updatedAt: "2026-11-07T10:11:12Z"
    ParticipantInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
          default: ""
        phone:
          type: string
          maxLength: 40
          default: ""
    ParticipantList:
      type: object
      required: [items, rev]
      properties:
        items:
          type: array
          maxItems: 20000
          items:
            $ref: "#/components/schemas/Participant"
        rev:
          type: integer
          format: int64
          description: Monotonic revision of the project's table, usable as a resync marker.
    ParticipantItems:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Participant"
    ParticipantResponse:
      type: object
      required: [item]
      properties:
        item:
          $ref: "#/components/schemas/Participant"
    CreateParticipantsRequest:
      description: Exactly one of the two shapes.
      oneOf:
        - type: object
          title: ByCount
          required: [count]
          additionalProperties: false
          properties:
            count:
              type: integer
              minimum: 1
              maximum: 5000
        - type: object
          title: ByItems
          required: [items]
          additionalProperties: false
          properties:
            items:
              type: array
              minItems: 1
              maxItems: 5000
              items:
                $ref: "#/components/schemas/ParticipantInput"
    UpdateParticipantRequest:
      type: object
      required: [version]
      properties:
        name:
          type: string
          maxLength: 200
        phone:
          type: string
          maxLength: 40
        version:
          type: integer
          minimum: 1
    ParticipantIds:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 20000
          uniqueItems: true
          items:
            type: string
            format: uuid
    DeletedCount:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: integer
          minimum: 0
    ClearParticipantsRequest:
      type: object
      required: [confirmTitle]
      properties:
        confirmTitle:
          type: string
          minLength: 1
          maxLength: 120
          description: Must equal the project title.
    ImportUpload:
      type: object
      required: [file, mode]
      properties:
        file:
          type: string
          format: binary
          description: XLSX or CSV file.
        mode:
          type: string
          enum: [append, replace]
    ImportRowError:
      type: object
      required: [row, field, code, message]
      properties:
        row:
          type: integer
          minimum: 1
          description: 1-based row number in the uploaded file.
        field:
          type: string
          enum: [name, phone]
        code:
          type: string
          example: too_long
        message:
          type: string
    ImportResult:
      type: object
      required: [dryRun, mode, total, valid, imported, errors]
      properties:
        dryRun:
          type: boolean
        mode:
          type: string
          enum: [append, replace]
        total:
          type: integer
          minimum: 0
          description: Data rows found in the file.
        valid:
          type: integer
          minimum: 0
          description: Rows without errors.
        imported:
          type: integer
          minimum: 0
          description: Rows written (always 0 for a dry run).
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ImportRowError"

    ClientError:
      type: object
      required: [message]
      properties:
        message:
          type: string
          maxLength: 2000
        stack:
          type: string
          maxLength: 4000
        url:
          type: string
          maxLength: 1000
        ua:
          type: string
          maxLength: 500
        release:
          type: string
          maxLength: 64
