openapi: 3.1.0
info:
  title: TIP Web API
  version: 1.0.0
  summary: REST contract of the TIP Web backend (tipd).
  description: |
    REST API of TIP Web, an internal tool for contest operators: projects, participant tables,
    ticket images, real-time collaboration and role-based administration.

    All paths are relative to the server base path `/api/v1`. Bodies are JSON (UTF-8), fields are
    `camelCase`, timestamps are RFC 3339 in UTC. Identifiers are UUIDs. Row and project `version`
    values are integers that grow on every write (optimistic concurrency).

    ## Authentication

    * Login returns a token pair: a short-lived access JWT (HS256, 15 minutes) in the body and a
      refresh JWT (30 days) in the `httpOnly` cookie `tip_rt` (`Secure; SameSite=Strict; Path=/api/v1/auth`).
    * Protected requests send `Authorization: Bearer <accessToken>`. The user's permissions travel inside
      the access token (`roles`, `perms` claims) and are checked without database lookups.
    * `401 TOKEN_EXPIRED` and `401 TOKEN_STALE` mean: call `POST /auth/refresh`, then repeat the request once.
      `TOKEN_STALE` means roles or permissions changed (the permission epoch `pe` in the token is outdated);
      the refreshed token carries the current permissions.
    * `401 UNAUTHENTICATED` means the token is missing, malformed, blacklisted (logout, deactivation,
      password change); the client must go to the login screen.
    * `401 REFRESH_INVALID` means the refresh token is expired, burnt, revoked or reused (a second use later
      than 10 seconds after rotation closes the whole chain); a new login is required.
    * Redis holds token state. When it is unavailable `login`, `refresh` and `logout` answer
      `503 AUTH_UNAVAILABLE`; other requests do so only when `REDIS_FAIL_MODE=closed`.
    * Cookie endpoints (`/auth/refresh`, `/auth/logout`) additionally check `Sec-Fetch-Site`/`Origin`;
      cross-origin requests get `403 FORBIDDEN`.
    * With `FORCE_PASSWORD_CHANGE=true` a user holding a temporary password gets
      `403 PASSWORD_CHANGE_REQUIRED` everywhere except `/me`, `/me/password`, `/auth/refresh`, `/auth/logout`.

    ## Permissions

    Every protected operation lists the permission codes it requires in the vendor extension
    `x-required-permissions` (the catalog is documented in `docs/02-architecture.md`, section 5.1).
    An empty list means the endpoint needs authentication only. Self-service profile endpoints need the
    implicit `profile.edit` right, which every signed-in user has and which is not part of the catalog,
    so they also use an empty list. A missing permission yields `403 FORBIDDEN`; a hidden resource yields `404 NOT_FOUND`.

    ## Errors

    Every error uses the `Error` envelope: `{"error": {"code", "message", "details"}}`. `code` is a stable
    machine-readable value from a closed enum, `message` is a human-readable English text, `details` is optional.
    Validation errors carry per-field information in `details.fields`. `500 INTERNAL` only carries the request id.
    Every response has an `X-Request-Id` header (an incoming one is accepted and echoed).

    ## Caching

    `GET /projects/{id}/participants`, `GET /projects/{id}/image` and avatar endpoints return a strong `ETag`
    and honour `If-None-Match` (answering `304 Not Modified` without a body). Project images are served with
    `ETag` equal to the SHA-256 of the content and `Cache-Control: public, max-age=31536000, immutable`
    (the URL carries a `v` query parameter that changes together with the content).

    ## WebSocket protocol

    OpenAPI cannot model WebSockets, so the realtime channel is described here.
    Endpoint: `GET /api/v1/projects/{id}/ws` (HTTP upgrade, `Origin` is checked). The token is never put in the URL.
    Frames are text JSON of the form `{"t": "<type>", ...}`, at most 4 KiB each, at most 20 messages per second.

    Lifecycle:
    1. The client connects and must send `auth` as its first frame within 5 seconds. A missing `auth`, an invalid
       token or a missing `project.view` permission closes the socket with code `1008`.
       Connection rights come from the token `perms`: data needs `participant.view`, taking locks needs `participant.edit`.
    2. The server answers `hello`; the client then fetches `GET /projects/{id}/participants` (resync) and renders.
    3. The server closes with `1013` (slow client or overload), `1008` (no/expired token, no rights, deactivated user)
       or `1001` (restart). The client reconnects with exponential backoff and jitter (1 s up to 15 s) and resyncs.
    4. A lock not renewed for 45 seconds is released by the server, which broadcasts `unlock`.
    5. When permissions change the server sends `reauth`; the client refreshes the token pair and sends a new `auth`
       within 5 seconds, otherwise the socket is closed with `1008`.

    Client to server frames:

    | `t` | fields | meaning |
    |---|---|---|
    | `auth` | `token` | First frame: access JWT. Repeated after every `/auth/refresh` and in reply to `reauth`. |
    | `ping` | none | Heartbeat every 15 s; renews all locks of the client. |
    | `cursor` | `rowId?`, `field?` | The user is on this row/cell (not exclusive). `rowId=null` clears it. |
    | `lock.acquire` | `rowId` | Start editing a row. |
    | `lock.release` | `rowId` | Finish editing (blur, Enter, Esc). |

    Server to client frames:

    | `t` | fields | meaning |
    |---|---|---|
    | `hello` | `you`, `peers:[{id,displayName,color,avatarUrl}]`, `cursors:{userId:{rowId,field}}`, `locks:{rowId:{by,expiresAt}}`, `serverTime` | First message. |
    | `reauth` | none | Permissions changed: refresh the pair and send a new `auth`. |
    | `presence` | `peers` | Who is online. |
    | `cursor` | `userId`, `rowId?`, `field?` | Another participant's cursor. |
    | `lock` / `unlock` | `rowId`, `by`, `expiresAt` | A row was locked or released; `by` is the editing user id. |
    | `lock.denied` | `rowId`, `by` | Reply to `lock.acquire` when the row is taken. |
    | `rows.upsert` | `items:[Participant]` | Rows changed or added; apply when `version` is greater than the local one. |
    | `rows.delete` | `ids` | Rows deleted. |
    | `project.updated` | `project` | Project changed (settings, status `finished` makes the UI read-only). |
    | `error` | `code`, `message` | Limit violations etc.; on `RATE_LIMITED` the connection is closed. |
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: Same origin as the web application.
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Liveness and readiness probes.
  - name: Auth
    description: Login, token refresh and logout.
  - name: Profile
    description: The signed-in user's own profile.
  - name: Users
    description: User administration and avatars.
  - name: Roles
    description: Permission catalog and role management.
  - name: Admin
    description: Audit log and system status.
  - name: Projects
    description: Projects, their placeholders and ticket images.
  - name: Fonts
    description: Fonts uploaded for ticket text.
  - name: Participants
    description: Participant tables, import, export and printing log.
  - name: Diagnostics
    description: Frontend error reports.

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getHealthz
      summary: Liveness probe
      description: Returns 200 while the process is alive.
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example: { status: ok }
  /readyz:
    get:
      tags: [Health]
      operationId: getReadyz
      summary: Readiness probe
      description: Pings PostgreSQL and Redis and checks that `DATA_DIR` is usable.
      security: []
      responses:
        "200":
          description: All dependencies are available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example: { status: ok, checks: { postgres: ok, redis: ok, dataDir: ok } }
        "503":
          description: At least one dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example: { status: unavailable, checks: { postgres: ok, redis: fail, dataDir: ok } }

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in
      description: |
        Verifies the credentials and returns the access token in the body together with the refresh token in the
        `tip_rt` cookie. When `user.passwordTemporary` is true the UI recommends changing the password
        (it may be postponed unless `FORCE_PASSWORD_CHANGE=true`). Rate limited per IP and login.
      security: []
      x-required-permissions: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example: { login: a.sharafutdinov, password: correct-horse-battery }
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/BadCredentials"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Rotate the token pair
      description: |
        Exchanges the refresh cookie for a new pair. The old refresh token is burnt in Redis; presenting it again
        within 10 seconds is idempotent, later it is treated as reuse (`401 REFRESH_INVALID`, chain closed).
        Roles and permissions in the new access token are read from the database.
      security:
        - refreshCookie: []
      x-required-permissions: []
      responses:
        "200":
          description: A new pair was issued.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/RefreshInvalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out
      description: |
        Blacklists the current access token `jti`, revokes the whole refresh chain and clears the cookie.
        The UI always calls it.
      x-required-permissions: []
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ClearRefreshCookie"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /me:
    get:
      tags: [Profile]
      operationId: getMe
      summary: Get the current user
      x-required-permissions: []
      responses:
        "200":
          description: The current user with roles and effective permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Profile]
      operationId: updateMe
      summary: Update the own profile
      description: Requires the implicit `profile.edit` right that every signed-in user has.
      x-required-permissions: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
            example: { displayName: Azam Tursunov, color: "#ffb84d", locale: uz, theme: dark }
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /me/password:
    post:
      tags: [Profile]
      operationId: changePassword
      summary: Change the own password
      description: |
        Clears `passwordTemporary`, writes a per-user revocation cutoff in Redis (all earlier access and refresh
        tokens become invalid) and issues a fresh pair for the current client. A wrong `current` password is
        reported as `400 VALIDATION` with a field error on `current`, so that the client does not treat it as
        a lost session.
      x-required-permissions: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed; a new pair was issued.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /me/avatar:
    put:
      tags: [Profile]
      operationId: putMyAvatar
      summary: Upload the own avatar
      description: PNG or JPEG up to 2 MiB. The server resizes it to 256x256.
      x-required-permissions: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AvatarUpload"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "422":
          $ref: "#/components/responses/ImageInvalid"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "507":
          $ref: "#/components/responses/DiskLow"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Profile]
      operationId: deleteMyAvatar
      summary: Remove the own avatar
      x-required-permissions: []
      responses:
        "200":
          description: The updated user (`avatarUrl` is null).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /users/{id}/avatar:
    get:
      tags: [Users]
      operationId: getUserAvatar
      summary: Get a user's avatar image
      x-required-permissions: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The avatar image (256x256 JPEG).
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users
      x-required-permissions: [user.view]
      responses:
        "200":
          description: All users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user
      description: |
        The server generates a random 16 character password (`crypto/rand`) and returns it once as `tempPassword`;
        only its hash is stored and `passwordTemporary` is true. Without `role.manage` only the default role
        (`worker`) is assigned; passing `roleIds` requires `role.manage`.
      x-required-permissions: [user.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
            example: { login: m.karimov, displayName: Murod Karimov, color: "#6cb4ff" }
      responses:
        "201":
          description: The user was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUserResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/users/{id}:
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Update or deactivate a user
      description: |
        Deactivation writes a revocation cutoff in Redis (access and refresh tokens die at once, the WebSocket is closed).
        Deactivating the last active admin yields `409 LAST_ADMIN`.
      x-required-permissions: [user.manage]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LastAdmin"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/users/{id}/roles:
    put:
      tags: [Users]
      operationId: setUserRoles
      summary: Replace the roles of a user
      description: |
        Bumps the permission epoch `pe`: the user's tokens get `401 TOKEN_STALE` and refresh transparently.
        Removing the admin role from the last active admin yields `409 LAST_ADMIN`.
      x-required-permissions: [role.manage]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserRolesRequest"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LastAdmin"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/users/{id}/reset-password:
    post:
      tags: [Users]
      operationId: resetUserPassword
      summary: Reset a user's password
      description: |
        Generates a new random password (returned once), invalidates the user's tokens via the Redis cutoff and sets
        `passwordTemporary=true`.
      x-required-permissions: [user.manage]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The new temporary password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TempPasswordResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/permissions:
    get:
      tags: [Roles]
      operationId: listPermissions
      summary: Permission catalog
      description: The catalog drives the checkbox matrix of the admin panel.
      x-required-permissions: [role.manage]
      responses:
        "200":
          description: All permissions known to the server.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/roles:
    get:
      tags: [Roles]
      operationId: listRoles
      summary: List roles
      x-required-permissions: [role.manage]
      responses:
        "200":
          description: All roles with user counts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Roles]
      operationId: createRole
      summary: Create a role
      description: The server adds dependent permissions (for example `participant.edit` implies `participant.view`).
      x-required-permissions: [role.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: The role was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/roles/{id}:
    get:
      tags: [Roles]
      operationId: getRole
      summary: Get a role with its users
      x-required-permissions: [role.manage]
      parameters:
        - $ref: "#/components/parameters/RoleId"
      responses:
        "200":
          description: The role and the users who hold it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Roles]
      operationId: updateRole
      summary: Update a role
      description: Bumps the permission epoch. The `admin` role cannot be edited (`409 ROLE_SYSTEM`).
      x-required-permissions: [role.manage]
      parameters:
        - $ref: "#/components/parameters/RoleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: The updated role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
