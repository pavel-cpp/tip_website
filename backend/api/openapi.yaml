  /projects/{id}/image:
    put:
      tags: [Projects]
      operationId: putProjectImage
      summary: Upload the ticket image
      description: |
        Multipart upload of a PNG or JPEG up to 10 MiB and 16 megapixels; images larger than 4096 px on the
        long side are downscaled. Failures: 413, 415, 422, 507.
      x-required-permissions: [project.update]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImageUpload"
      responses:
        "200":
          description: The updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ProjectFinished"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "422":
          $ref: "#/components/responses/ImageInvalid"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "507":
          $ref: "#/components/responses/DiskLow"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Projects]
      operationId: getProjectImage
      summary: Download the ticket image
      description: |
        Served with a strong `ETag` and `Cache-Control: immutable`. Without `size` the original image is
        returned (`ETag` is the SHA-256 of the content). With `size=thumb` a JPEG whose long side is at most
        480 px is returned (`ETag` is `<sha>-thumb`); it is generated at upload time, and a project whose
        thumbnail is missing gets the original instead.
      x-required-permissions: [project.view]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: size
          in: query
          required: false
          description: "`thumb` selects the small preview used by project cards."
          schema:
            type: string
            enum: [thumb]
      responses:
        "200":
          description: The original image.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              description: Always `public, max-age=31536000, immutable`.
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

